[package]
name = "mcdu-doom"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "DOOM framebuffer adapter for WINCTRL Airbus MCDU-32"
readme = "README.md"
default-run = "mcdu-doom"
include = ["/src/**", "/tests/**", "/examples/**", "/assets/**", "/vendor/doomgeneric/**", "/docs/**", "/specs/**", "/scripts/**", "/.github/**", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/LICENSES/**", "/LICENSE-POLICY.md", "/MODIFICATIONS.md", "/NOTICE.md", "/THIRD_PARTY.md", "/CONTRIBUTING.md", "/README.md", "/README.ru.md", "/run.ps1", "/probe-grid.ps1", "/rustfmt.toml", "/.editorconfig", "/.gitattributes", "/.gitignore"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
hidapi = "2.6.7"
minifb = "0.29"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
cc = "1.2"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
